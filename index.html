    // Haversine distance in KM
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

        return dataset.upazilas.filter(u => u.district_name === distName).map(u => u.name).sort();

      const getUnionsForUpazila = (upzName, distName) => {

      };

      const getAvailableCityAreas = (distName) => {

      // Available Level 5 Sub-Areas for a selected Level 4 Area
      const getAvailableSubAreas = (areaName, distName) => {
        if (!areaName) return [];

        return catalog[areaName] || [];

      // Standard City Corporation Wards
      const METRO_WARDS = useMemo(() => Array.from({ length: 54 }, (_, i) => `Ward ${i + 1}`), []);

      // Core Reverse Geocoder with Level Mapping
      function resolveCoordinatesToHierarchy(lat, lon) {
        if (!dataset) return null;

        // 1. Division
        let bestDiv = null, minDivDist = Infinity;
        for (const d of dataset.divisions) {
          const dist = getDistanceKm(lat, lon, d.lat, d.lon);
          if (dist < minDivDist) { minDivDist = dist; bestDiv = d; }
        }

        // 2. District
        let bestDist = null, minDistDist = Infinity;
        for (const d of dataset.districts) {
          const dist = getDistanceKm(lat, lon, d.lat, d.lon);
          if (dist < minDistDist) { minDistDist = dist; bestDist = d; }
        }

        // 3. Postcode
        let bestPost = null, minPostDist = Infinity;
        for (const p of dataset.postcodes) {
          const dist = getDistanceKm(lat, lon, p.lat, p.lon);
          if (dist < minPostDist) { minPostDist = dist; bestPost = p; }
        }

        // 4. City Corporation
        let nearestCC = null, minCCDist = Infinity;
        for (const cc of dataset.city_corporations) {
          const dist = getDistanceKm(lat, lon, cc.lat, cc.lon);
          if (dist < minCCDist) { minCCDist = dist; nearestCC = cc; }
        }

        const isMetro = Boolean(
          (bestPost && bestPost.city_corporation) ||
          (nearestCC && minCCDist <= 18 && bestPost && bestPost.thana && !bestPost.upazila_name)
        );

        let resolvedUpazila = "";
        let resolvedThana = "";
        let resolvedUnion = null;

        if (isMetro) {
          resolvedThana = bestPost?.thana || (nearestCC ? nearestCC.name : 'Metro Thana');
          resolvedUpazila = "";
        } else {
          let bestUpz = null, minUpzDist = Infinity;
          for (const u of dataset.upazilas) {
            const dist = getDistanceKm(lat, lon, u.lat, u.lon);
            if (dist < minUpzDist) { minUpzDist = dist; bestUpz = u; }
          }
          resolvedUpazila = bestUpz?.name || "";
          resolvedThana = bestPost?.thana || "";

          let minUnionDist = Infinity;
          for (const un of dataset.unions) {
            const dist = getDistanceKm(lat, lon, un.lat, un.lon);
            if (dist < minUnionDist) { minUnionDist = dist; resolvedUnion = un; }
          }
        }

        // 5. Nearest Landmark / POI (within 400m)
        let nearestLandmark = null;
        if (dataset.osm_landmarks && dataset.osm_landmarks.length > 0) {
          let minLandmarkDist = Infinity;
          for (const lm of dataset.osm_landmarks) {
            const dist = getDistanceKm(lat, lon, lm.lat, lm.lon);
            if (dist < minLandmarkDist) {
              minLandmarkDist = dist;
              nearestLandmark = { ...lm, dist };
            }
          }
          if (minLandmarkDist > 0.40) nearestLandmark = null;
        }

        // 6. OSM Places
        const sortedPlaces = [];
        for (const place of dataset.osm_places) {
          const dist = getDistanceKm(lat, lon, place.lat, place.lon);
          if (dist <= 35) {
            sortedPlaces.push({ ...place, dist });
          }
        }
        sortedPlaces.sort((a, b) => a.dist - b.dist);

        const microPlace = sortedPlaces.find(p => p.type === 'city_block' && p.dist < 0.6);
        const macroPlace = sortedPlaces.find(p => ['quarter', 'suburb', 'neighbourhood', 'town', 'city', 'village'].includes(p.type) && p.dist < 3.5);
        const primaryOsm = macroPlace || sortedPlaces[0] || null;

        // Map resolved Thana/Place to Courier City Area
        let matchedArea = "Mirpur";
        const placeName = (macroPlace?.nameEn || primaryOsm?.nameEn || resolvedThana || '').toLowerCase();
        
        const cityAreas = getAvailableCityAreas(bestDist?.name || 'Dhaka');
        for (const a of cityAreas) {
          if (placeName.includes(a.toLowerCase())) {
            matchedArea = a;
            break;
          }
        }

        const extractedHierarchy = {
          division: bestDiv?.name || 'Dhaka',
          district: bestDist?.name || 'Dhaka',
          upazila: resolvedUpazila,
          thana: resolvedThana,
          wardUnion: resolvedUnion ? resolvedUnion.name : (isMetro ? 'Ward 10' : ''),
          area: matchedArea,
          subArea: macroPlace ? macroPlace.nameEn : '',
          block: microPlace ? microPlace.nameEn : '',
          road: nearestLandmark ? `${nearestLandmark.nameEn}` : ''
        };

        const partsEn = [];
        const partsBn = [];

        if (nearestLandmark) {
          partsEn.push(nearestLandmark.nameEn || nearestLandmark.name);
          partsBn.push(nearestLandmark.nameBn || nearestLandmark.name);
        }
        if (microPlace) {
          partsEn.push(microPlace.nameEn);
          partsBn.push(microPlace.nameBn);
        }
        if (macroPlace && (!nearestLandmark || !nearestLandmark.name.toLowerCase().includes(macroPlace.name.toLowerCase()))) {
          partsEn.push(macroPlace.nameEn);
          partsBn.push(macroPlace.nameBn);
        }

        if (isMetro) {
          if (resolvedThana) partsEn.push(`${resolvedThana} Thana`);
          if (bestDist?.name) partsEn.push(bestDist.name);
        } else {
          if (resolvedUnion?.name) partsEn.push(`${resolvedUnion.name} Union`);
          if (resolvedUpazila) partsEn.push(`${resolvedUpazila} Upazila`);
          if (bestDist?.name) partsEn.push(`${bestDist.name} District`);
        }

        if (bestPost?.postcode) partsEn.push(`Postcode: ${bestPost.postcode}`);

        const humanReadableAddressEn = partsEn.filter(Boolean).join(', ');
        const humanReadableAddressBn = partsBn.filter(Boolean).join(', ');

        return {
          coords: { lat, lon },
          isMetro,
          humanReadableAddressEn,
          humanReadableAddressBn,
          extractedHierarchy,
          nearestLandmark,
          microPlace,
          macroPlace,
          primaryPlace: primaryOsm,
          division: bestDiv,
          district: bestDist,
          upazila: resolvedUpazila,
          thana: resolvedThana,
          union: resolvedUnion,
          postcode: bestPost
        };
      }

      // Intelligent Hub Assignment & Out-of-Zone Fallback
      function assignCourierHub(locationInfo, customHierarchy, isPickup = true) {
        if (!locationInfo) return null;

        const coords = locationInfo.coords;
        const textToMatch = (
          (customHierarchy?.division || '') + ' ' +
          (customHierarchy?.district || '') + ' ' +
          (customHierarchy?.upazila || '') + ' ' +
          (customHierarchy?.thana || '') + ' ' +
          (customHierarchy?.wardUnion || '') + ' ' +
          (customHierarchy?.area || '') + ' ' +
          (customHierarchy?.subArea || '') + ' ' +
          (customHierarchy?.block || '') + ' ' +
          (customHierarchy?.road || '') + ' ' +
          (locationInfo.nearestLandmark?.name || '') + ' ' +
          (locationInfo.microPlace?.name || '') + ' ' +
          (locationInfo.macroPlace?.name || '') + ' ' +
          (locationInfo.humanReadableAddressEn || '')
        ).toLowerCase();

        // 1. Direct Keyword Zone Matching
        for (const hub of COURIER_HUBS) {
          for (const kw of hub.coverageKeywords) {
            if (textToMatch.includes(kw)) {
              const d = getDistanceKm(coords.lat, coords.lon, hub.lat, hub.lon);
              if (d <= hub.maxPrimaryRadiusKm + 2.5) {
                return {
                  hub,
                  isOutOfZone: false,
                  routingType: isPickup ? 'IN_ZONE_FIRST_MILE' : 'IN_ZONE_LAST_MILE',
                  rule: `Primary Zone Coverage ("${kw}")`,
                  distanceKm: d.toFixed(1),
                  sla: 'Same-Day Express (< 6 Hours)',
                  cost: '৳60 Intra-City Standard',
                  dispatchNote: isPickup
                    ? `Inside primary hub zone. Local fleet rider dispatched: ${hub.rider}.`
                    : `Inside primary delivery zone. Local delivery fleet assigned: ${hub.rider}.`
                };
              }
            }
          }
        }

        // 2. Postal Code Routing
        if (locationInfo.postcode?.postcode) {
          for (const hub of COURIER_HUBS) {
            if (hub.postcodes.includes(locationInfo.postcode.postcode)) {
              const d = getDistanceKm(coords.lat, coords.lon, hub.lat, hub.lon);
              if (d <= hub.maxPrimaryRadiusKm + 2.0) {
                return {
                  hub,
                  isOutOfZone: false,
                  routingType: isPickup ? 'IN_ZONE_FIRST_MILE' : 'IN_ZONE_LAST_MILE',
                  rule: `Postal Code Routing (${locationInfo.postcode.postcode})`,
                  distanceKm: d.toFixed(1),
                  sla: 'Same-Day Express (< 6 Hours)',
                  cost: '৳60 Intra-City Standard',
                  dispatchNote: isPickup
                    ? `Assigned to origin hub by Postcode. Local fleet rider: ${hub.rider}.`
                    : `Dispatched from destination hub by Postcode. Rider: ${hub.rider}.`
                };
              }
            }
          }
        }

        // 3. Proximity Calculation to ALL Hubs
        let nearestHub = null;
        let minDistance = Infinity;

        for (const hub of COURIER_HUBS) {
          const d = getDistanceKm(coords.lat, coords.lon, hub.lat, hub.lon);
          if (d < minDistance) {
            minDistance = d;
            nearestHub = hub;
          }
        }

        if (minDistance <= (nearestHub.maxPrimaryRadiusKm || 5.0)) {
          return {
            hub: nearestHub,
            isOutOfZone: false,
            routingType: isPickup ? 'IN_ZONE_PROXIMITY' : 'IN_ZONE_PROXIMITY',
            rule: `Proximity Dispatch (${minDistance.toFixed(1)} km)`,
            distanceKm: minDistance.toFixed(1),
            sla: 'Same-Day Standard',
            cost: '৳60 Intra-City Standard',
            dispatchNote: isPickup
              ? `Nearby origin within service radius. Dispatched from ${nearestHub.name}.`
              : `Nearby destination within delivery radius. Dispatched from ${nearestHub.name}.`
          };
        }

        // 4. OUT-OF-ZONE / UNCOVERED REGION DETECTED!
        return {
          hub: nearestHub,
          isOutOfZone: true,
          routingType: isPickup ? 'OUT_OF_ZONE_FIRST_MILE_FALLBACK' : 'OUT_OF_ZONE_LAST_MILE_FALLBACK',
          rule: isPickup
            ? `⚠️ Out-of-Zone Auto-Calculation: Nearest First-Mile Hub (${minDistance.toFixed(1)} km away)`
            : `⚠️ Out-of-Zone Auto-Calculation: Nearest Last-Mile Hub (${minDistance.toFixed(1)} km away)`,
          distanceKm: minDistance.toFixed(1),
          sla: 'Sub-Urban Feeder Transit: Next-Day SLA (+24 Hours)',
          cost: '৳90 (৳60 Base + ৳30 Out-of-Zone Surcharge)',
          dispatchNote: isPickup
            ? `ORIGIN IS OUTSIDE PRIMARY HUB ZONE! Auto-assigned closest First-Mile Hub [${nearestHub.code}]. Feeder pickup van dispatched to collect parcel.`
            : `DESTINATION IS OUTSIDE PRIMARY HUB ZONE! Auto-routed to closest Last-Mile Hub [${nearestHub.code}]. Transferred via Linehaul for extended drop-off.`
        };
      }

      // Update Pickup
      useEffect(() => {
        if (!dataset) return;
        const pLat = parseFloat(pickupLat);
        const pLon = parseFloat(pickupLon);
        if (!isNaN(pLat) && !isNaN(pLon)) {
          const loc = resolveCoordinatesToHierarchy(pLat, pLon);
          const hubAssign = assignCourierHub(loc, pickupHierarchy, true);
          setPickupResult({ loc, hubAssign });

      // Update Delivery

        if (!dataset) return;

        if (!isNaN(dLat) && !isNaN(dLon)) {

          setDeliveryResult({ loc, hubAssign });

      // Update Single Inspector (Tab 2)
      useEffect(() => {
        if (!dataset) return;

        const lon = parseFloat(inspLon);

      // Inspector Hierarchy Handler (L1-L5 selection auto-syncs coordinates)
      function updateInspectorHierarchy(field, val) {
        setInspHierarchy(prev => {
          const next = { ...prev, [field]: val };
          if (field === 'division') {
            const dists = getDistrictsForDivision(val);
            next.district = dists[0] || 'Dhaka';
            next.upazila = '';
            next.thana = '';
            next.wardUnion = '';
          } else if (field === 'district') {
            next.upazila = '';
            next.thana = '';
            next.wardUnion = '';
          } else if (field === 'upazila') {
            if (val) next.thana = '';
            next.wardUnion = '';
          } else if (field === 'thana') {
            if (val) next.upazila = '';
            next.wardUnion = '';
          } else if (field === 'area') {
            const subList = getAvailableSubAreas(val, next.district);
            next.subArea = subList[0] || '';
          }
          return next;
        });

        if (!dataset) return;
        if (field === 'area' || field === 'subArea') {
          const searchName = (val || '').toLowerCase();
          const match = dataset.osm_places?.find(p => 
            p.nameEn?.toLowerCase() === searchName || 
            p.name?.toLowerCase() === searchName ||
            p.nameEn?.toLowerCase().includes(searchName)
          );
          if (match && match.lat && match.lon) {
            setInspLat(match.lat.toFixed(5));
            setInspLon(match.lon.toFixed(5));
          }
        } else if (field === 'upazila') {
          const upz = dataset.upazilas?.find(u => u.name.toLowerCase() === (val || '').toLowerCase());
          if (upz && upz.lat && upz.lon) {
            setInspLat(upz.lat.toFixed(5));
            setInspLon(upz.lon.toFixed(5));
          }
        } else if (field === 'district') {
          const dist = dataset.districts?.find(d => d.name.toLowerCase() === (val || '').toLowerCase());
          if (dist && dist.lat && dist.lon) {
            setInspLat(dist.lat.toFixed(5));
            setInspLon(dist.lon.toFixed(5));
          }
        }
      }

      // Live Filtered Nearby Landmarks for [L7] in Single Coordinate Inspector
      const inspectorNearbyLandmarks = useMemo(() => {
        if (!dataset || !dataset.osm_landmarks) return [];
        const lat = parseFloat(inspLat);
        const lon = parseFloat(inspLon);
        const areaName = (inspHierarchy.area || '').toLowerCase();
        const subAreaName = (inspHierarchy.subArea || '').toLowerCase();

        const results = [];
        for (const lm of dataset.osm_landmarks) {
          const dist = (!isNaN(lat) && !isNaN(lon)) ? getDistanceKm(lat, lon, lm.lat, lm.lon) : 999;
          const matchArea = (lm.nameEn && (lm.nameEn.toLowerCase().includes(subAreaName) || lm.nameEn.toLowerCase().includes(areaName)));
          if (dist <= 3.5 || (matchArea && dist <= 12.0)) {
            results.push({ ...lm, dist });
          }
          if (results.length >= 24) break;
        }
        return results.sort((a, b) => a.dist - b.dist);
      }, [dataset, inspLat, inspLon, inspHierarchy.area, inspHierarchy.subArea]);

      // Apply Scenario
      function applyScenario(sc) {
        setPickupLat(sc.pickup.lat.toString());
        setPickupLon(sc.pickup.lon.toString());
        setDeliveryLat(sc.delivery.lat.toString());
        setDeliveryLon(sc.delivery.lon.toString());

        setPickupHierarchy({
          division: "Dhaka",
          district: "Dhaka",
          upazila: sc.pickup.upazila || "",
          thana: sc.pickup.thana || "",
          wardUnion: sc.pickup.wardUnion || "",
          area: sc.pickup.area || "Mirpur",
          subArea: sc.pickup.subArea || "",
          block: "",
          road: sc.pickup.road || ""
        });

        setDeliveryHierarchy({
          division: "Dhaka",
          district: "Dhaka",
          upazila: sc.delivery.upazila || "",
          thana: sc.delivery.thana || "",
          wardUnion: sc.delivery.wardUnion || "",
          area: sc.delivery.area || "Dhanmondi",
          subArea: sc.delivery.subArea || "",
          block: "",
          road: sc.delivery.road || ""
        });
      }

      // Auto-populate hierarchy from coordinates
      function syncHierarchyFromCoords(isPickup) {
        if (!dataset) return;
        const lat = parseFloat(isPickup ? pickupLat : deliveryLat);
        const lon = parseFloat(isPickup ? pickupLon : deliveryLon);
        if (isNaN(lat) || isNaN(lon)) return;
        const loc = resolveCoordinatesToHierarchy(lat, lon);
        if (loc?.extractedHierarchy) {
          if (isPickup) {
            setPickupHierarchy({ ...loc.extractedHierarchy });
          } else {
            setDeliveryHierarchy({ ...loc.extractedHierarchy });
          }
        }
      }

      // Re-anchor coordinates from hierarchy selection
      function syncCoordsFromHierarchy(isPickup) {
        if (!dataset) return;
        const hier = isPickup ? pickupHierarchy : deliveryHierarchy;
        let target = null;
        
        // 1. Check SubArea in OSM places
        if (hier.subArea) {
          target = dataset.osm_places.find(p => p.nameEn.toLowerCase() === hier.subArea.toLowerCase());
        }
        // 2. Check Area in OSM places
        if (!target && hier.area) {
          target = dataset.osm_places.find(p => p.nameEn.toLowerCase() === hier.area.toLowerCase());
        }
        // 3. Check Thana postcodes
        if (!target && hier.thana) {
          target = dataset.postcodes.find(p => p.thana && p.thana.toLowerCase() === hier.thana.toLowerCase());
        }
        // 4. Check Upazila
        if (!target && hier.upazila) {
          target = dataset.upazilas.find(u => u.name.toLowerCase() === hier.upazila.toLowerCase());
        }

        if (target) {
          if (isPickup) {
            setPickupLat(Number(target.lat).toFixed(5));
            setPickupLon(Number(target.lon).toFixed(5));
          } else {
            setDeliveryLat(Number(target.lat).toFixed(5));
            setDeliveryLon(Number(target.lon).toFixed(5));
          }
        }
      }

      // Download location_data JSON
      function handleDownloadData(e) {
        if (dataset) {
          if (e) e.preventDefault();
          const blob = new Blob([JSON.stringify(dataset, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'location_data.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
      }

              /* TAB 2: Single Coordinate Inspector */
              <div className="space-y-6">
                
                {/* Top Control Bar: Coordinates & Presets */}
                <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3">
                    <div>
                      <h2 className="font-extrabold text-slate-900 text-base tracking-tight">
                        Single Coordinate & Locality Inspector
                      </h2>
                      <p className="text-xs text-slate-500">
                        Input any GPS coordinates across Bangladesh, or pick dropdowns below to inspect reverse geocoding, operational hub fallback, and doorstep POI landmarks.
                      </p>
                    </div>

                    <div className="flex items-center space-x-2">
                      <button
                        type="button"
                        onClick={() => {
                          navigator.clipboard.writeText(`${inspLat}, ${inspLon}`);
                          setCopiedInsp(true);
                          setTimeout(() => setCopiedInsp(false), 2000);
                        }}
                        className="text-xs font-bold px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition"
                      >
                        {copiedInsp ? '✓ Coords Copied!' : '📋 Copy Coords'}
                      </button>
                    </div>
                  </div>

                  {/* Lat/Lon Inputs & Quick Test Presets */}
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                    <div className="md:col-span-3">
                      <label className="text-xs font-bold text-slate-700 block mb-1">Latitude</label>
                      <input
                        type="number"
                        step="any"
                        value={inspLat}
                        onChange={(e) => setInspLat(e.target.value)}
                        className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-xl font-mono font-bold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>
                    <div className="md:col-span-3">
                      <label className="text-xs font-bold text-slate-700 block mb-1">Longitude</label>
                      <input
                        type="number"
                        step="any"
                        value={inspLon}
                        onChange={(e) => setInspLon(e.target.value)}
                        className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-xl font-mono font-bold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>

                    {/* Presets Chips */}
                    <div className="md:col-span-6 space-y-1">
                      <span className="text-[10px] font-bold text-slate-400 uppercase block">Quick Test Inspection Presets:</span>
                      <div className="flex flex-wrap gap-1.5">
                        {[
                          { label: 'Mirpur-10 (Hope School)', lat: '23.80811', lon: '90.37306', area: 'Mirpur', subArea: 'Mirpur 10' },
                          { label: 'Dhanmondi-27 (Rapa Plaza)', lat: '23.75380', lon: '90.37680', area: 'Dhanmondi', subArea: 'Dhanmondi 27 (Old)' },
                          { label: 'Kaundia (Savar Rural)', lat: '23.80556', lon: '90.33889', area: 'Savar', subArea: 'Kaundia' },
                          { label: 'Merul Badda (Dhaka)', lat: '23.76900', lon: '90.42600', area: 'Badda', subArea: 'Merul Badda' },
                          { label: 'Uttara Sector 3', lat: '23.86930', lon: '90.39270', area: 'Uttara', subArea: 'Sector 3' },
                          { label: 'Debidwar (Cumilla)', lat: '23.57970', lon: '90.99800', area: 'Debidwar', subArea: 'Debidwar Sadar' }
                        ].map((p, idx) => (
                          <button
                            key={idx}
                            type="button"
                            onClick={() => {
                              setInspLat(p.lat);
                              setInspLon(p.lon);
                              setInspHierarchy(prev => ({ ...prev, area: p.area, subArea: p.subArea }));
                            }}
                            className="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-300 border border-slate-200 transition"
                          >
                            📍 {p.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                {/* Main 2-Column Split: [L1-L5] on Left, [L6-L7] on Right */}
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                  
                  {/* LEFT SIDE: Level 1 to Level 5 Dropdowns */}
                  <div className="lg:col-span-6 bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                      <div>
                        <span className="text-[10px] font-black uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">
                          Administrative & Locality Flow
                        </span>
                        <h3 className="font-extrabold text-slate-900 text-sm mt-1">
                          [L1] to [L5] Hierarchy Dropdowns
                        </h3>
                      </div>
                      <span className="text-[11px] text-slate-400">Cascading Auto-Sync</span>
                    </div>

                    {/* [L1] Division & [L2] District */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-bold text-slate-700 block mb-1">
                          <span className="text-emerald-700 font-extrabold mr-1">[L1]</span> Division:
                        </label>
                        <select
                          value={inspHierarchy.division}
                          onChange={(e) => updateInspectorHierarchy('division', e.target.value)}
                          className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500"
                        >
                          {divisionList.map(d => (
                            <option key={d} value={d}>{d}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-700 block mb-1">
                          <span className="text-emerald-700 font-extrabold mr-1">[L2]</span> District:
                        </label>
                        <select
                          value={inspHierarchy.district}
                          onChange={(e) => updateInspectorHierarchy('district', e.target.value)}
                          className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500"
                        >
                          {getDistrictsForDivision(inspHierarchy.division).map(d => (
                            <option key={d} value={d}>{d}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    {/* [L3-A] Upazila & [L3-B] Thana */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 border-t border-slate-100">
                      <div>
                        <label className="text-xs font-bold text-slate-700 block mb-1">
                          <span className="text-emerald-700 font-extrabold mr-1">[L3-A]</span> Upazila (Rural):
                        </label>
                        <select
                          value={inspHierarchy.upazila}
                          onChange={(e) => updateInspectorHierarchy('upazila', e.target.value)}
                          className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500"
                        >
                          <option value="">-- Optional / None --</option>
                          {getUpazilasForDistrict(inspHierarchy.district).map(u => (
                            <option key={u} value={u}>{u} Upazila</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-700 block mb-1">
                          <span className="text-emerald-700 font-extrabold mr-1">[L3-B]</span> Thana (Metro):
                        </label>
                        <select
                          value={inspHierarchy.thana}
                          onChange={(e) => updateInspectorHierarchy('thana', e.target.value)}
                          className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500"
                        >
                          <option value="">-- Optional / None --</option>
                          {getThanasForDistrict(inspHierarchy.district).map(t => (
                            <option key={t} value={t}>{t} Thana</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    {/* [L3-C] Ward / Union */}
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">
                        <span className="text-emerald-700 font-extrabold mr-1">[L3-C]</span> Ward / Union (4,540 Unions / 54 Wards):
                      </label>
                      <select
                        value={inspHierarchy.wardUnion}
                        onChange={(e) => updateInspectorHierarchy('wardUnion', e.target.value)}
                        className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500"
                      >
                        <option value="">-- Select Ward or Union --</option>
                        {getWardsAndUnions(inspHierarchy.district, inspHierarchy.upazila, inspHierarchy.thana).map(w => (
                          <option key={w} value={w}>{w}</option>
                        ))}
                      </select>
                    </div>

                    {/* [L4] Area / Locality */}
                    <div className="pt-1 border-t border-slate-100">
                      <label className="text-xs font-bold text-slate-700 block mb-1">
                        <span className="text-emerald-700 font-extrabold mr-1">[L4]</span> Area / Locality:
                      </label>
                      <select
                        value={inspHierarchy.area}
                        onChange={(e) => updateInspectorHierarchy('area', e.target.value)}
                        className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-500"
                      >
                        {getAvailableAreas(inspHierarchy.district).map(a => (
                          <option key={a} value={a}>{a}</option>
                        ))}
                      </select>
                    </div>

                    {/* [L5] Sub-Area & Section (Dual Input) */}
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">
                        <span className="text-emerald-700 font-extrabold mr-1">[L5]</span> Sub-Area & Sections (Dual Input):
                      </label>
                      
                      <div className="space-y-2">
                        {/* Companion Dropdown */}
                        <select
                          value={inspHierarchy.subArea}
                          onChange={(e) => updateInspectorHierarchy('subArea', e.target.value)}
                          className="w-full px-3 py-2 text-xs bg-emerald-50/60 border border-emerald-300 rounded-xl font-semibold text-emerald-950 focus:bg-white focus:ring-2 focus:ring-emerald-500"
                        >
                          <option value="">-- Quick Pick Known Sub-Area --</option>
                          {getAvailableSubAreas(inspHierarchy.area, inspHierarchy.district).map(s => (
                            <option key={s} value={s}>{s}</option>
                          ))}
                        </select>

                        {/* Free Text Input with Datalist */}
                        <div className="relative">
                          <input
                            type="text"
                            list="insp-subarea-list"
                            placeholder="Or type custom sub-area name..."
                            value={inspHierarchy.subArea}
                            onChange={(e) => updateInspectorHierarchy('subArea', e.target.value)}
                            className="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-xl font-medium text-slate-800 focus:ring-2 focus:ring-emerald-500"
                          />
                          <datalist id="insp-subarea-list">
                            {getAvailableSubAreas(inspHierarchy.area, inspHierarchy.district).map(s => (
                              <option key={s} value={s} />
                            ))}
                          </datalist>
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 text-[11px] text-slate-600 flex items-center justify-between">
                      <span>💡 <strong>Live Coordinate Sync:</strong> Dropdown picks auto-calculate representative centroids.</span>
                      <span className="font-mono text-emerald-700 font-bold">{inspLat}, {inspLon}</span>
                    </div>

                  </div>

                  {/* RIGHT SIDE: Level 6 & Level 7 Under Selected Level 5 */}
                  <div className="lg:col-span-6 space-y-4">
                    
                    {/* Level 6 & Level 7 Doorstep Card */}
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                      <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                        <div>
                          <span className="text-[10px] font-black uppercase tracking-wider text-teal-600 bg-teal-50 px-2 py-0.5 rounded-full border border-teal-200">
                            Doorstep Last-Mile Specifics
                          </span>
                          <h3 className="font-extrabold text-slate-900 text-sm mt-1">
                            [L6] & [L7] Under Selected [L5]: <span className="text-emerald-700">{inspHierarchy.subArea || inspHierarchy.area}</span>
                          </h3>
                        </div>
                        <span className="text-[11px] text-slate-400 font-mono">Precision Layer</span>
                      </div>

                      {/* [L6] Block / Sector / Section */}
                      <div>
                        <label className="text-xs font-bold text-slate-700 block mb-1">
                          <span className="text-teal-700 font-extrabold mr-1">[L6]</span> Block / Sector / Section:
                        </label>
                        
                        {/* Quick Block Pills */}
                        <div className="flex flex-wrap gap-1 mb-2">
                          {['Block A', 'Block B', 'Block C', 'Block D', 'Section 1', 'Section 6', 'Section 10', 'Sector 3', 'Sector 4', 'Road 27'].map(blk => (
                            <button
                              key={blk}
                              type="button"
                              onClick={() => setInspHierarchy(prev => ({ ...prev, block: blk }))}
                              className={`text-[10px] font-bold px-2 py-0.5 rounded-md border transition ${
                                inspHierarchy.block === blk
                                  ? 'bg-teal-600 text-white border-teal-600'
                                  : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                              }`}
                            >
                              {blk}
                            </button>
                          ))}
                        </div>

                        <input
                          type="text"
                          placeholder="e.g. Block C, Section 10, or Sector 4"
                          value={inspHierarchy.block}
                          onChange={(e) => setInspHierarchy(prev => ({ ...prev, block: e.target.value }))}
                          className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl font-medium text-slate-800 focus:bg-white focus:ring-2 focus:ring-teal-500"
                        />
                      </div>

                      {/* [L7] Road / House / Landmark / Delivery Instruction */}
                      <div className="pt-2 border-t border-slate-100">
                        <label className="text-xs font-bold text-slate-700 block mb-1">
                          <span className="text-teal-700 font-extrabold mr-1">[L7]</span> Road, House & POI Landmark (Delivery Instruction):
                        </label>
                        
                        <input
                          type="text"
                          placeholder="e.g. Hope International School Road, House 12, Road 4"
                          value={inspHierarchy.road}
                          onChange={(e) => setInspHierarchy(prev => ({ ...prev, road: e.target.value }))}
                          className="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-xl font-medium text-slate-800 focus:bg-white focus:ring-2 focus:ring-teal-500"
                        />

                        {/* Live Filtered Nearby Landmarks Chips for [L7] */}
                        {inspectorNearbyLandmarks.length > 0 && (
                          <div className="mt-3 bg-teal-50/50 border border-teal-200/80 rounded-2xl p-3 space-y-1.5">
                            <span className="text-[10px] font-bold text-teal-800 uppercase block">
                              📍 Instant POI Landmarks in {inspHierarchy.subArea || inspHierarchy.area} (Click to Pin):
                            </span>
                            <div className="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto pr-1">
                              {inspectorNearbyLandmarks.map((lm, idx) => (
                                <button
                                  key={idx}
                                  type="button"
                                  onClick={() => {
                                    setInspHierarchy(prev => ({ ...prev, road: lm.nameEn || lm.name }));
                                    setInspLat(lm.lat.toFixed(5));
                                    setInspLon(lm.lon.toFixed(5));
                                  }}
                                  className="text-[10px] font-semibold px-2 py-1 rounded-lg bg-white hover:bg-teal-600 hover:text-white border border-teal-200 text-teal-900 transition flex items-center gap-1 shadow-2xs"
                                >
                                  <span>{lm.type === 'school' ? '🏫' : (lm.type === 'hospital' ? '🏥' : (lm.type === 'bank' ? '🏦' : '📍'))}</span>
                                  <span className="truncate max-w-[170px]">{lm.nameEn || lm.name}</span>
                                  <span className="text-[9px] opacity-75 font-mono">({lm.dist.toFixed(1)}km)</span>
                                </button>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>

                    </div>

                    {/* Operational Hub Assignment & Reverse Geocoded Card */}
                    {inspResult && (
                      <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                          <h4 className="font-extrabold text-slate-900 text-xs uppercase tracking-wider">
                            Operational Hub & Reverse Geocode Result
                          </h4>
                          <span className={`text-[10px] font-black px-2.5 py-1 rounded-full uppercase ${
                            inspResult.hubAssign.isOutOfZone ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                          }`}>
                            {inspResult.hubAssign.isOutOfZone ? '⚠️ Out-of-Zone Fallback Hub' : '🟢 Primary Coverage Hub'}
                          </span>
                        </div>

                        {/* Hub Details Box */}
                        <div className={`p-4 rounded-2xl border-2 space-y-1.5 ${
                          inspResult.hubAssign.isOutOfZone
                            ? 'bg-amber-50/90 border-amber-400 text-amber-950'
                            : 'bg-emerald-50/90 border-emerald-400 text-emerald-950'
                        }`}>
                          <div className="flex items-center justify-between">
                            <span className="text-base font-black">
                              {inspResult.hubAssign.hub.name} [{inspResult.hubAssign.hub.code}]
                            </span>
                            <span className="text-xs font-mono font-bold bg-white px-2 py-0.5 rounded-md border border-slate-200">
                              {inspResult.hubAssign.distanceKm} km away
                            </span>
                          </div>
                          <p className="text-xs font-medium opacity-90">📍 Hub Address: {inspResult.hubAssign.hub.address}</p>
                          <p className="text-[11px] font-mono opacity-80">Assignment Rule: {inspResult.hubAssign.rule}</p>
                        </div>

                        {/* Full Address */}
                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-1.5 text-xs">
                          <span className="text-[10px] font-bold text-slate-400 uppercase block">Resolved Complete Address:</span>
                          <div className="text-sm font-bold text-slate-900 leading-snug">
                            {inspResult.loc.humanReadableAddressEn}
                          </div>
                          <div className="text-xs font-semibold text-emerald-700 bangla-text">
                            {inspResult.loc.humanReadableAddressBn}
                          </div>
                        </div>

                      </div>
                    )}

                  </div>

                </div>

              </div>
            )}
</main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
